name: Desktop installers

on:
  pull_request:
    paths: ['src/**', 'packaging/**', 'scripts/**', 'brand/**', 'pyproject.toml', '.github/workflows/desktop-build.yml']
  push:
    branches: [main]
    paths: ['src/**', 'packaging/**', 'scripts/**', 'brand/**', 'pyproject.toml', '.github/workflows/desktop-build.yml']
  workflow_dispatch:

# Candidate publication is gated on full acceptance and all native builds.
permissions:
  contents: read

concurrency:
  group: desktop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  icons:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_release_inputs.py
      - run: python -m pip install CairoSVG Pillow
      - run: python scripts/build_icons.py
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-icons
          path: build/icons/*
          if-no-files-found: error

  build:
    needs: icons
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: ThreadDesk-Windows
            arch: x86_64
            deployment: ''
          - os: macos-15-intel
            artifact: ThreadDesk-macOS
            arch: x86_64
            deployment: '10.15'
          - os: macos-15
            artifact: ThreadDesk-macOS-AppleSilicon
            arch: arm64
            deployment: '11.0'
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/download-artifact@v4
        with:
          name: desktop-icons
          path: build/icons
      - name: Check release inputs
        run: python scripts/check_release_inputs.py
      - name: Install build and test tools
        run: python -m pip install -e '.[dev,ui,desktop]' pyinstaller
      - name: Test native startup helpers
        run: python -m pytest tests/test_desktop_entry.py tests/test_desktop_runtime.py -q
      - name: Build desktop app
        run: pyinstaller --noconfirm --clean packaging/ThreadDesk.spec
      - name: Test packaged Windows app with bounded exit
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $process = Start-Process -FilePath (Resolve-Path 'dist/ThreadDesk.exe').Path -ArgumentList '--self-test' -PassThru
          if (-not $process.WaitForExit(90000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw 'Packaged self-test did not terminate'
          }
          $process.Refresh()
          if ($process.ExitCode -ne 0) { throw "Packaged self-test failed: $($process.ExitCode)" }
      - name: Test packaged macOS app and architecture
        if: runner.os == 'macOS'
        run: |
          test "$(uname -m)" = '${{ matrix.arch }}'
          file dist/ThreadDesk.app/Contents/MacOS/ThreadDesk | grep '${{ matrix.arch }}'
          dist/ThreadDesk.app/Contents/MacOS/ThreadDesk --self-test
          test -f dist/ThreadDesk.app/Contents/Resources/icon.icns
      - name: Create Windows download
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Move-Item dist/ThreadDesk.exe ThreadDesk-Windows.exe
          python scripts/package_provenance.py ThreadDesk-Windows.exe
      - name: Create macOS disk image
        if: runner.os == 'macOS'
        run: |
          codesign --deep --force --sign - dist/ThreadDesk.app
          mkdir -p dmg
          cp -R dist/ThreadDesk.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname ThreadDesk -srcfolder dmg -ov -format UDZO '${{ matrix.artifact }}.dmg'
          python scripts/package_provenance.py '${{ matrix.artifact }}.dmg'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.exe
            ${{ matrix.artifact }}.dmg
            ${{ matrix.artifact }}.*.sha256
            ${{ matrix.artifact }}.*.build.json
          if-no-files-found: error

  acceptance:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/tests.yml

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, acceptance]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: ThreadDesk-*
          path: release-files
          merge-multiple: true
      - name: Verify every native download and source receipt
        run: python scripts/verify_release.py release-files --commit "$GITHUB_SHA"
      - name: Publish versioned candidate without replacing existing downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(python -c 'from scripts.package_provenance import package_version; print(package_version())')"
          tag="v$version"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Version already published; existing downloads remain unchanged."
            exit 0
          fi
          gh release create "$tag" release-files/* --target "$GITHUB_SHA" --prerelease \
            --title "ThreadDesk $version – aktuelle Desktop-Ausgabe" --notes-file docs/RELEASE-NOTES.md
