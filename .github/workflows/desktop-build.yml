name: Desktop installers

on:
  push:
    branches: [feat/knowledge-graph-core]
    paths:
      - "src/**"
      - "packaging/**"
      - "pyproject.toml"
      - ".github/workflows/desktop-build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: ThreadDesk-Windows
          - os: macos-14
            artifact: ThreadDesk-macOS
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tools
        run: python -m pip install -e ".[ui,desktop]" pyinstaller
      - name: Build desktop app
        run: pyinstaller --noconfirm --clean packaging/ThreadDesk.spec
      - name: Create Windows download
        if: runner.os == 'Windows'
        shell: pwsh
        run: Move-Item dist/ThreadDesk.exe ThreadDesk-Windows.exe
      - name: Create macOS disk image
        if: runner.os == 'macOS'
        run: |
          mkdir -p dmg
          cp -R dist/ThreadDesk.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname ThreadDesk -srcfolder dmg -ov -format UDZO ThreadDesk-macOS.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ThreadDesk-*
          if-no-files-found: error

  publish-preview:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Publish stable preview downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view preview --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload preview release/* --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit preview --prerelease --title "ThreadDesk Preview" --notes "Fertige Desktop-Ausgaben: herunterladen, öffnen, fertig." --repo "$GITHUB_REPOSITORY"
          else
            gh release create preview release/* --prerelease --target "$GITHUB_SHA" --title "ThreadDesk Preview" --notes "Fertige Desktop-Ausgaben: herunterladen, öffnen, fertig." --repo "$GITHUB_REPOSITORY"
          fi
