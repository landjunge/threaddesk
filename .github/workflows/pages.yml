# Deploy product site (site/) to GitHub Pages
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_configured: ${{ steps.pages.outputs.configured }}
    steps:
      - uses: actions/checkout@v4
      - name: Check Pages configuration
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          status="$(curl -sS -o /tmp/pages.json -w "%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/pages")"

          if [ "$status" = "200" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          elif [ "$status" = "404" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages is not enabled for $REPO. Skipping deploy. Enable once: Settings → Pages → Source: GitHub Actions."
          else
            cat /tmp/pages.json
            echo "::error::Unexpected response while checking GitHub Pages configuration: HTTP $status"
            exit 1
          fi
      - name: Setup Pages
        uses: actions/configure-pages@v5
        if: steps.pages.outputs.configured == 'true'
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.configured == 'true'
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.pages_configured == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

