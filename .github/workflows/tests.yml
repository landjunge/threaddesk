name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Complete suite including browser, twice
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Reject private runtime files in source
        run: python scripts/check_release_inputs.py
      - name: Install
        run: python -m pip install -e '.[dev,ui,browser]'
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Complete acceptance, first run
        run: python -m pytest -q -ra --junitxml=test-results/first.xml
      - name: Complete acceptance, repeat
        run: python -m pytest -q -ra --junitxml=test-results/second.xml
      - name: No failures or unexpected skipped acceptance tests
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          for name in ('first', 'second'):
              root = ET.parse(f'test-results/{name}.xml').getroot()
              suites = list(root.iter('testsuite'))
              assert suites and sum(int(s.get('tests', 0)) for s in suites) >= 500
              for attribute in ('failures', 'errors'):
                  assert sum(int(s.get(attribute, 0)) for s in suites) == 0, attribute
              # This explicitly opt-in test needs a separately installed local
              # model. Keep it visible as NOT TESTED; never allow other skips.
              skipped = [case for case in root.iter('testcase') if case.find('skipped') is not None]
              for case in skipped:
                  assert case.get('classname') == 'tests.test_desk_browser'
                  assert case.get('name') == 'test_user_runs_the_housekeeper_on_an_installed_model'
                  assert case.find('skipped').get('message') == 'Live-Modelltest benötigt THREADDESK_HAUSMEISTER_LIVE=1'
              assert len(skipped) <= 1
              print(f'{name}: {sum(int(s.get("tests", 0)) for s in suites)} tests; {len(skipped)} explicit live-model check not run')
          PY
      - name: Check JavaScript
        run: |
          node --check src/threaddesk/ui/static/map.js
          node --check src/threaddesk/ui/static/app.js
      - name: Test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: complete-test-results
          path: test-results/*.xml
          if-no-files-found: error
