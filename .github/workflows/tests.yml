name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backup-windows:
    # User decision 2026-10-24: native Windows development is temporarily paused.
    if: false
    name: Native Windows backup source and restore
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install backup test dependencies
        run: python -m pip install -e '.[dev,ui]'
      - name: Test actual Windows handles, JSON and SQLite restore
        run: python -m pytest tests/test_windows_backup_source.py tests/test_workspace_backup.py tests/test_portable_backup.py tests/test_library_backup.py tests/test_json_control_paths.py tests/test_thread_management.py tests/test_atomic_import.py tests/test_json_migration.py tests/test_relative_json_workspace.py -q -ra --junitxml=test-results/windows-backup.xml
      - name: Reject missing or skipped Windows evidence
        run: |
          python -c "import xml.etree.ElementTree as E; s=list(E.parse('test-results/windows-backup.xml').getroot().iter('testsuite')); assert s and sum(int(x.get('tests',0)) for x in s)>0; assert all(sum(int(x.get(k,0)) for x in s)==0 for k in ('skipped','failures','errors'))"
      - name: Windows backup results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-backup-test-results
          path: test-results/windows-backup.xml
          if-no-files-found: error
  test:
    name: Complete suite including browser, twice
    runs-on: ubuntu-latest
    # CI 41003824290 measured 1242s for the previous whole acceptance run.
    # New cases measured 94.086s UI/observation + 3.890s conflict tests locally.
    # Budget both runs, setup and jitter; individual deadlines/gates unchanged.
    timeout-minutes: 55
    env:
      PYTHONPATH: src:tests
      PYTEST_PLUGINS: http_navigation_diagnostics
      THREADDESK_NAV_DIAGNOSTICS_DIR: test-results/navigation
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Reject private runtime files in source
        run: python scripts/check_release_inputs.py
      - name: Install
        run: python -m pip install -e '.[dev,ui,browser]'
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Check activity completion and previous Linux navigation without changing timeouts
        run: python -m pytest -q -s tests/test_activity_browser.py 'tests/test_design_browser.py::test_five_pages_use_consistent_desktop_controls[de-1920-1080]' --junitxml=test-results/navigation-check.xml
      - name: Complete acceptance, first run
        run: python -m pytest -q -ra --junitxml=test-results/first.xml
      - name: Complete acceptance, repeat
        run: python -m pytest -q -ra --junitxml=test-results/second.xml
      - name: No skipped acceptance tests
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          for name in ('first', 'second'):
              root = ET.parse(f'test-results/{name}.xml').getroot()
              suites = list(root.iter('testsuite'))
              assert suites and sum(int(s.get('tests', 0)) for s in suites) >= 500
              for attribute in ('skipped', 'failures', 'errors'):
                  assert sum(int(s.get(attribute, 0)) for s in suites) == 0, attribute
          PY
      - name: Check JavaScript
        run: |
          for script in src/threaddesk/ui/static/*.js; do
            node --check "$script"
          done
      - name: Test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: complete-test-results
          path: test-results/*.xml
          if-no-files-found: error
      - name: Navigation timeout observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: navigation-timeout-observations
          path: test-results/navigation/*.json
          if-no-files-found: ignore
