name: Server Sync Linux TLS Restore

on:
  pull_request:
    paths: ['src/threaddesk/server_sync/**', 'packaging/server/**', 'tests/test_server_sync*', 'pyproject.toml', '.github/workflows/server-sync.yml']
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-sync-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux-tls-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install targeted test dependencies
        run: python -m pip install -e '.[server,dev]'
      - name: Cold snapshot and hostile restore tests
        run: python -m pytest -q tests/test_server_sync_backup.py
      - name: Sync browser script syntax
        run: |
          node --check src/threaddesk/server_sync/web/app.js
          node --check src/threaddesk/ui/static/server-sync.js
      - name: Build Linux image; verify TLS, replicas, restart and complete restore
        shell: bash
        run: python packaging/server/check_acceptance.py 2>&1 | tee server-sync-acceptance.log
      - name: Shipping Caddy route limits, verified TLS and real large requests
        shell: bash
        run: python packaging/server/check_proxy_acceptance.py --skip-build 2>&1 | tee server-sync-proxy-acceptance.log
      - name: Acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: server-sync-linux-tls-restore
          path: |
            server-sync-acceptance.log
            server-sync-proxy-acceptance.log
          if-no-files-found: error
