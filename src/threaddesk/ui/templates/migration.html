{% extends "base.html" %}
{% block body %}
<main class="panel migration-center" data-testid="migration-center">
  <p class="eyebrow">{{ t("migration.eyebrow") }}</p>
  <h1>{{ t("migration.title") }}</h1>
  <p class="muted">{{ t("migration.intro") }}</p>
  <label for="bundle-file">{{ t("migration.file") }}</label>
  <input id="bundle-file" data-testid="bundle-file" type="file" accept=".tdbundle">
  <section data-testid="dry-run" aria-live="polite"><h2>{{ t("migration.dry_run") }}</h2><p class="muted" data-migration-summary>{{ t("migration.select_hint") }}</p></section>
  <button class="btn btn-primary" data-testid="import-confirm" type="button" disabled>{{ t("migration.confirm") }}</button>
</main>
<script src="/static/migration.js" defer></script>
{% endblock %}
