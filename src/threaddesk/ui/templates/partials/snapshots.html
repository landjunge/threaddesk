<section id="snapshots" class="block">
  <h3>{{ t("snapshots.title") }}</h3>
  <p class="muted">{{ t("snapshots.current") }} {{ current.current_snapshot_id or t("snapshots.none") }}</p>
  <form
    class="inline-form"
    hx-post="/threads/{{ current.id }}/snapshot"
    hx-target="#workspace"
    hx-swap="innerHTML"
  >
    <input type="text" name="label" data-snapshot-label maxlength="120" placeholder="{{ t('snapshots.label_placeholder') }}" />
    <button type="submit" class="btn btn-primary">{{ t("snapshots.save") }}</button>
  </form>
  {% if snapshots %}
  <ul class="snap-list">
    {% for s in snapshots %}
    <li class="snap-item">
      <div>
        <p class="snap-label">{{ s.label or t("snapshots.unnamed") }}</p>
        <p class="thread-id">{{ s.id }} · {{ s.created_at }}</p>
      </div>
      <form
        hx-post="/snapshots/{{ s.id }}/restore"
        hx-target="#workspace"
        hx-swap="innerHTML"
        hx-confirm="{{ t('snapshots.confirm_restore') }}"
      >
        <button type="submit" class="btn btn-ghost">{{ t("snapshots.load") }}</button>
      </form>
    </li>
    {% endfor %}
  </ul>
  {% endif %}
</section>
