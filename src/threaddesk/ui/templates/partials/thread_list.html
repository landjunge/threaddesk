<section id="thread-list" class="panel threads">
  <header class="panel-head">
    <h2>{{ t("list.title") }}</h2>
    <span class="count">{{ threads|length }}</span>
  </header>
  <div class="new-thread" x-data="{ open: false }">
    <button type="button" class="btn btn-ghost" data-new-thread @click="open = !open">
      {{ t("list.new") }} <kbd>n</kbd>
    </button>
    <form
      class="stack"
      x-show="open"
      x-cloak
      hx-post="/threads"
      hx-target="#workspace"
      hx-swap="innerHTML"
    >
      <label class="field">
        <span>{{ t("list.title_label") }}</span>
        <input type="text" name="title" data-new-title required maxlength="160" placeholder="{{ t('list.new_thread_placeholder') }}" />
      </label>
      <label class="field">
        <span>{{ t("list.description") }}</span>
        <input type="text" name="description" maxlength="400" />
      </label>
      <button type="submit" class="btn btn-primary">{{ t("list.create") }}</button>
    </form>
  </div>
  {% if threads %}
  <ul class="thread-items">
    {% for t in threads %}
    <li>
      <button
        type="button"
        class="thread-item{% if t.id == current_id %} is-current{% endif %}"
        data-thread-id="{{ t.id }}"
        data-thread-index="{{ loop.index }}"
        hx-post="/threads/{{ t.id }}/switch"
        hx-target="#workspace"
        hx-swap="innerHTML"
      >
        <span class="thread-meta">
          <span class="status status-{{ t.status }}">{{ t.status }}</span>
          <span class="thread-index">{{ loop.index }}</span>
        </span>
        <span class="thread-title">{{ t.title }}</span>
      </button>
    </li>
    {% endfor %}
  </ul>
  {% else %}
  <p class="empty">{{ t("list.empty") }}</p>
  {% endif %}
</section>
