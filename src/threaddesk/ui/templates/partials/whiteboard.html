<div class="whiteboard" data-whiteboard>
  <h3>{{ t("whiteboard.title") }}</h3>
  {% if whiteboard %}
  <ol class="whiteboard-log" data-whiteboard-log>
    {% for entry in whiteboard %}
    <li class="whiteboard-entry" data-whiteboard-entry data-entry-id="{{ entry.id }}">
      <p class="whiteboard-meta">
        <time datetime="{{ entry.created_at }}">{{ entry.created_at[:16].replace('T', ' ') }}</time>
        {{ entry.actor }}
        <span>{{ t('whiteboard.entry.' ~ entry.entry_type) }}</span>
      </p>
      <p class="whiteboard-body">{{ entry.content }}</p>
    </li>
    {% endfor %}
  </ol>
  {% else %}
  <p data-whiteboard-empty>{{ t("whiteboard.empty") }}</p>
  {% endif %}
  <form
    class="whiteboard-form"
    hx-post="/threads/{{ current.id }}/whiteboard"
    hx-target="#workspace"
    hx-swap="innerHTML"
  >
    <input type="hidden" name="actor_type" value="human" />
    <div class="inline-form">
      <input
        type="text"
        name="actor"
        required
        maxlength="80"
        value="{{ t('whiteboard.actor.human') }}"
        aria-label="{{ t('whiteboard.actor') }}"
        data-whiteboard-actor
      />
      <label class="whiteboard-kind">
        <span>{{ t("whiteboard.entry_label") }}</span>
        <select name="entry_type" data-whiteboard-type>
          {% for kind in whiteboard_types %}
          <option value="{{ kind }}">{{ t('whiteboard.entry.' ~ kind) }}</option>
          {% endfor %}
        </select>
      </label>
    </div>
    <textarea
      name="content"
      rows="2"
      required
      maxlength="8000"
      placeholder="{{ t('whiteboard.placeholder') }}"
      data-whiteboard-content
    ></textarea>
    <div class="inline-form">
      <input
        type="text"
        name="next_step"
        maxlength="240"
        placeholder="{{ t('whiteboard.next_placeholder') }}"
        aria-label="{{ t('whiteboard.next') }}"
        data-whiteboard-next
      />
      <button type="submit" class="btn btn-primary" data-whiteboard-submit>{{ t("whiteboard.append") }}</button>
    </div>
  </form>
</div>
