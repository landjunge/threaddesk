<section id="files" class="block">
  <h3>{{ t("files.title") }}</h3>
  <p class="muted">{{ t("files.hint") }}</p>
  {% if current.context.files %}
  <ul class="file-list">
    {% for path in current.context.files %}
    <li class="file-item">
      <code>{{ path }}</code>
      <form
        hx-post="/threads/{{ current.id }}/files/remove"
        hx-target="#workspace"
        hx-swap="innerHTML"
        hx-confirm="{{ t('files.confirm_remove') }}"
      >
        <input type="hidden" name="path" value="{{ path }}" />
        <button type="submit" class="btn btn-ghost btn-compact">{{ t("files.remove") }}</button>
      </form>
    </li>
    {% endfor %}
  </ul>
  {% else %}
  <p class="muted">{{ t("files.empty") }}</p>
  {% endif %}
  <form
    class="inline-form"
    hx-post="/threads/{{ current.id }}/files"
    hx-target="#workspace"
    hx-swap="innerHTML"
  >
    <input type="text" name="path" required maxlength="400" placeholder="src/app.py" />
    <button type="submit" class="btn btn-primary">{{ t("files.add") }}</button>
  </form>
</section>
